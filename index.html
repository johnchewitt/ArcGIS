<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>House Model</title>
  <meta name="description" content="A React + ArcGIS Maps SDK for JavaScript 5.0 app that builds a multi-wing house in seven stages, from survey pegs to a finished garden." />

  <!-- Type -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" />

  <!-- ArcGIS Maps SDK for JavaScript 5.0 (core API + map components) -->
  <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css" />
  <script type="module" src="https://js.arcgis.com/5.0/"></script>

  <!-- React 19 + htm (JSX-like templates with no build step) -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.1.0",
        "react-dom/client": "https://esm.sh/react-dom@19.1.0/client?deps=react@19.1.0",
        "htm": "https://esm.sh/htm@3.1.1"
      }
    }
  </script>

  <style>
    :root {
      --ink: #172036;
      --ink-2: #4b5572;
      --ink-3: #7a839c;
      --glass: rgba(247, 248, 252, 0.78);
      --glass-solid: rgba(255, 255, 255, 0.94);
      --rim: rgba(255, 255, 255, 0.65);
      --line: rgba(23, 32, 54, 0.09);
      --blue: #3d5afe;
      --blue-ink: #2a3fd6;
      --blue-wash: rgba(61, 90, 254, 0.1);
      --shadow: 0 24px 60px -24px rgba(12, 20, 44, 0.5), 0 2px 6px rgba(12, 20, 44, 0.08);
      --r-panel: 22px;
      --r-row: 12px;
      --font: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ink: #e9edf7;
        --ink-2: #b3bbd0;
        --ink-3: #8790a8;
        --glass: rgba(17, 22, 37, 0.74);
        --glass-solid: rgba(26, 32, 50, 0.95);
        --rim: rgba(255, 255, 255, 0.08);
        --line: rgba(233, 237, 247, 0.1);
        --blue: #7d8fff;
        --blue-ink: #a3b0ff;
        --blue-wash: rgba(125, 143, 255, 0.16);
        --shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.8), 0 2px 6px rgba(0, 0, 0, 0.3);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --ink: #e9edf7; --ink-2: #b3bbd0; --ink-3: #8790a8;
      --glass: rgba(17, 22, 37, 0.74); --glass-solid: rgba(26, 32, 50, 0.95);
      --rim: rgba(255, 255, 255, 0.08); --line: rgba(233, 237, 247, 0.1);
      --blue: #7d8fff; --blue-ink: #a3b0ff; --blue-wash: rgba(125, 143, 255, 0.16);
      --shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.8), 0 2px 6px rgba(0, 0, 0, 0.3);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body, #root { height: 100%; margin: 0; }
    body {
      background: #0d1220;
      color: var(--ink);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

    .app { position: fixed; inset: 0; }
    arcgis-scene { position: absolute; inset: 0; }

    .glass {
      background: var(--glass);
      backdrop-filter: blur(20px) saturate(1.5);
      -webkit-backdrop-filter: blur(20px) saturate(1.5);
      border: 1px solid var(--rim);
      box-shadow: var(--shadow);
    }

    /* ---------- Stage panel ---------- */
    .panel {
      position: absolute;
      top: 16px; left: 16px;
      width: 352px;
      max-height: calc(100% - 140px);
      overflow: auto;
      border-radius: var(--r-panel);
      padding: 22px 14px 12px;
      scrollbar-width: thin;
    }
    .panel header { padding: 0 8px 16px; }
    .panel h1 {
      margin: 0 0 6px;
      font-size: 27px;
      line-height: 1.02;
      font-weight: 800;
      font-stretch: 125%;
      letter-spacing: -0.015em;
    }
    .panel header p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 30ch; }

    .stages { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
    .stage > button {
      width: 100%;
      display: grid;
      grid-template-columns: 30px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 7px 8px;
      border: 0;
      border-radius: var(--r-row);
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background-color .2s;
    }
    .stage > button:hover { background: var(--blue-wash); }
    .stage.current > button { background: var(--glass-solid); }
    .stage .name { font-weight: 560; font-stretch: 100%; }
    .stage.upcoming .name { color: var(--ink-2); font-weight: 480; }
    .stage .state { color: var(--ink-3); display: grid; place-items: center; width: 20px; }
    .stage.built .state { color: var(--blue); }

    /* Material swatches: each stage is marked by a sample of what it adds */
    .swatch {
      position: relative;
      width: 30px; height: 30px;
      border-radius: 8px;
      display: grid; place-items: center;
      font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
      color: var(--sw-ink, #fff);
      background-color: var(--sw);
      background-image: var(--sw-tex, none);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.25);
    }
    .stage.upcoming .swatch {
      background: transparent;
      color: var(--blue);
      box-shadow: inset 0 0 0 1.5px var(--blue);
      background-image: repeating-linear-gradient(135deg, var(--blue-wash) 0 3px, transparent 3px 6px);
    }
    .stage.current .swatch { box-shadow: 0 0 0 2px var(--glass-solid), 0 0 0 4px var(--sw), inset 0 0 0 1px rgba(0,0,0,.12); }

    .detail { padding: 6px 10px 14px 50px; }
    .detail p { margin: 0 0 12px; color: var(--ink-2); font-size: 14px; max-width: 34ch; }
    .facts {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px;
      margin: 0 0 12px; padding: 12px 0 0; border-top: 1px solid var(--line);
    }
    .facts div { min-width: 0; }
    .facts dt { font-size: 12px; color: var(--ink-3); }
    .facts dd {
      margin: 1px 0 0; font-size: 19px; font-weight: 650; font-stretch: 88%;
      font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
    }
    .how {
      display: flex; gap: 8px; align-items: flex-start;
      margin: 0; font-size: 12.5px !important; color: var(--blue-ink) !important; line-height: 1.4;
    }
    .how svg { flex: none; margin-top: 2px; }

    /* ---------- Dock ---------- */
    .dock {
      position: absolute;
      left: 384px; right: 16px; bottom: 30px;
      border-radius: 20px;
      padding: 12px 14px 12px 12px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 18px;
    }
    .transport { display: flex; align-items: center; gap: 4px; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 50%;
      display: grid; place-items: center;
      border: 0; background: transparent; cursor: pointer;
      transition: background-color .2s;
    }
    .icon-btn:hover:not(:disabled) { background: var(--blue-wash); }
    .icon-btn:disabled { opacity: .35; cursor: default; }
    .play {
      width: 48px; height: 48px; border-radius: 50%;
      display: grid; place-items: center;
      border: 0; cursor: pointer;
      background: var(--blue); color: #fff;
      box-shadow: 0 8px 22px -8px var(--blue);
      transition: transform .15s;
    }
    .play:active { transform: scale(.95); }

    .timeline { min-width: 0; }
    .timeline-head {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 12px; margin-bottom: 8px;
    }
    .timeline-head strong { font-weight: 700; font-stretch: 112%; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .timeline-head span { color: var(--ink-3); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .track { display: flex; gap: 4px; }
    .seg {
      flex: 1; height: 22px; padding: 7px 0;
      border: 0; background: transparent; cursor: pointer;
    }
    .seg i {
      display: block; height: 8px; border-radius: 4px; position: relative; overflow: hidden;
      background: repeating-linear-gradient(135deg, var(--blue-wash) 0 3px, transparent 3px 6px);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--blue) 55%, transparent);
    }
    .seg.built i { background: var(--sw); box-shadow: inset 0 0 0 1px rgba(0,0,0,.14); }
    .seg.current i::after {
      content: ""; position: absolute; inset: 0;
      background: var(--sw);
      transform-origin: left;
      transform: scaleX(var(--fill, 1));
    }
    .seg.current.playing i::after { animation: fill var(--dwell) linear forwards; }
    @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .seg:hover i { filter: brightness(1.1); }

    .controls { display: flex; align-items: center; gap: 6px; }
    .toggle {
      display: inline-flex; align-items: center; gap: 7px;
      height: 36px; padding: 0 13px 0 11px;
      border-radius: 999px; border: 1px solid var(--line);
      background: transparent; cursor: pointer; font-size: 13.5px; font-weight: 560;
      color: var(--ink-2);
      transition: background-color .2s, color .2s, border-color .2s;
    }
    .toggle[aria-pressed="true"] { background: var(--blue-wash); color: var(--blue-ink); border-color: transparent; }
    .sun {
      display: inline-flex; align-items: center; gap: 8px;
      height: 36px; padding: 0 12px 0 10px; border-radius: 999px; border: 1px solid var(--line);
      color: var(--ink-2); font-size: 13.5px; font-variant-numeric: tabular-nums;
    }
    .sun input { width: 92px; accent-color: var(--blue); }

    /* ---------- Picked element ---------- */
    .pick {
      position: absolute; top: 16px; right: 16px;
      width: 260px; border-radius: 18px; padding: 14px 14px 14px 16px;
      display: grid; grid-template-columns: 1fr auto; gap: 2px 8px;
    }
    .pick h2 { margin: 0; font-size: 16px; font-weight: 700; font-stretch: 106%; line-height: 1.2; }
    .pick p { margin: 0; grid-column: 1; color: var(--ink-2); font-size: 13.5px; }
    .pick .icon-btn { grid-row: 1 / span 2; grid-column: 2; width: 32px; height: 32px; margin: -4px -6px 0 0; }

    .hint {
      position: absolute; top: 16px; right: 16px;
      padding: 9px 14px; border-radius: 999px; font-size: 13px; color: var(--ink-2);
    }

    /* ---------- Move the house ---------- */
    .place {
      position: absolute; top: 16px; right: 16px;
      width: 300px; border-radius: 18px; padding: 16px;
    }
    .place h2 { margin: 0 0 4px; font-size: 16px; font-weight: 700; font-stretch: 106%; }
    .place p { margin: 0 0 12px; color: var(--ink-2); font-size: 13.5px; }
    .rot { display: grid; grid-template-columns: auto 1fr 3.2em; align-items: center; gap: 10px; font-size: 13.5px; color: var(--ink-2); }
    .rot input { width: 100%; accent-color: var(--blue); }
    .rot output { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
    .place-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .done {
      height: 34px; padding: 0 16px; border-radius: 999px; border: 0; cursor: pointer;
      background: var(--blue); color: #fff; font-weight: 600; font-size: 13.5px;
    }

    /* ---------- Loading / error ---------- */
    .veil {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: radial-gradient(120% 90% at 50% 40%, #1b2440 0%, #0d1220 70%);
      color: #e9edf7; transition: opacity .8s; z-index: 5;
    }
    .veil.gone { opacity: 0; pointer-events: none; }
    .veil-inner { text-align: center; padding: 24px; max-width: 420px; }
    .veil h1 { font-size: 34px; font-weight: 800; font-stretch: 125%; margin: 0 0 8px; letter-spacing: -0.015em; }
    .veil p { margin: 0; color: #b3bbd0; }
    .bar { width: 180px; height: 3px; border-radius: 2px; margin: 22px auto 0; background: rgba(125,143,255,.2); overflow: hidden; }
    .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #7d8fff; animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

    /* ---------- Small screens ---------- */
    @media (max-width: 860px) {
      .panel {
        top: 12px; left: 12px; right: 12px; width: auto;
        padding: 14px 10px 6px; max-height: 46%;
      }
      .panel h1 { font-size: 21px; }
      .panel header { padding-bottom: 8px; }
      .panel header p { display: none; }
      .stage:not(.current) { display: none; }
      .detail { padding-left: 10px; }
      .facts { grid-template-columns: repeat(4, auto); justify-content: start; }
      .dock {
        left: 12px; right: 12px; bottom: 24px;
        grid-template-columns: auto 1fr;
        gap: 10px 14px;
      }
      .controls { grid-column: 1 / -1; flex-wrap: wrap; }
      .pick, .hint { display: none; }
      .place { top: auto; bottom: 190px; left: 12px; right: 12px; width: auto; }
    }
    @media (max-width: 480px) {
      .facts { grid-template-columns: 1fr 1fr; }
      .sun input { width: 70px; }
      .transport .icon-btn { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation-duration: 0s !important; }
      .seg.current.playing i::after { animation: none; transform: scaleX(1); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React, { useEffect, useRef, useState, useCallback } from "react";
    import { createRoot } from "react-dom/client";
    import htm from "htm";

    const html = htm.bind(React.createElement);

    /* ==================================================================
       1. Where the house stands
       The default is the BT29 4LZ postcode centroid. Use "Move house" in
       the app to click the exact spot and turn the house to match; the
       position is kept in the page URL (?at=longitude,latitude,rotation).
       ================================================================== */
    const DEFAULT_PLACE = { longitude: -6.231254, latitude: 54.587167, rotation: 0 };
    const OFFSET = [0, -9];   // shifts the plan so the middle of the house sits on the chosen point
    const TARGET_Z = 4;       // the camera looks at this height above the ground floor
    const DWELL = 3400;       // ms each stage holds while playing
    const R_EARTH = 6378137;  // the sphere the SceneView renders on in global mode
    const M_LAT = (R_EARTH * Math.PI) / 180;

    function readPlace() {
      try {
        const at = new URLSearchParams(window.location.search).get("at");
        if (at) {
          const [longitude, latitude, rotation] = at.split(",").map(Number);
          if (Number.isFinite(longitude) && Number.isFinite(latitude)) {
            return { longitude, latitude, rotation: Number.isFinite(rotation) ? rotation : 0 };
          }
        }
      } catch { /* fall back to the default */ }
      return DEFAULT_PLACE;
    }
    function writePlace(p) {
      try {
        const url = new URL(window.location.href);
        url.searchParams.set("at", `${p.longitude.toFixed(6)},${p.latitude.toFixed(6)},${Math.round(p.rotation)}`);
        window.history.replaceState(null, "", url);
      } catch { /* the URL just won't remember it */ }
    }

    const prefersReducedMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const tan = (deg) => Math.tan((deg * Math.PI) / 180);

    /* ==================================================================
       2. Materials and stages
       ================================================================== */
    const MAT = {
      peg: [255, 106, 26, 1], string: [250, 250, 250, 1],
      concrete: [188, 186, 179, 1], block: [146, 145, 140, 1], slab: [204, 201, 193, 1],
      render: [233, 232, 227, 1], deck: [176, 140, 98, 1],
      tile: [72, 76, 84, 1], ridge: [54, 58, 66, 1], chimney: [226, 225, 220, 1], pot: [62, 58, 54, 1],
      gutter: [34, 36, 40, 1], timber: [152, 88, 46, 1], upvc: [240, 240, 238, 1], black: [30, 32, 36, 1],
      glass: [104, 134, 150, 0.5], sill: [208, 206, 199, 1], garage: [182, 108, 44, 1], groove: [136, 78, 30, 1],
      rooflight: [70, 74, 80, 1],
      trunk: [94, 72, 52, 1], leaf: [88, 136, 70, 1], leaf2: [122, 160, 80, 1], shrub: [74, 118, 62, 1],
      earth: [139, 117, 88, 1], lawn: [104, 150, 70, 1], paving: [206, 200, 189, 1], tarmac: [46, 47, 50, 1],
      gravel: [190, 180, 164, 1], bedWall: [214, 212, 206, 1], boundary: [255, 255, 255, 0.95],
    };

    const rgb = (c) => `rgb(${c[0]} ${c[1]} ${c[2]})`;
    const TEX = {
      speckle: "radial-gradient(circle at 30% 30%, rgba(255,255,255,.25) 0 1px, transparent 1.5px), radial-gradient(circle at 70% 60%, rgba(0,0,0,.15) 0 1px, transparent 1.5px)",
      roughcast: "radial-gradient(circle at 25% 35%, rgba(0,0,0,.08) 0 1px, transparent 1.5px), radial-gradient(circle at 65% 70%, rgba(0,0,0,.07) 0 1px, transparent 1.5px), radial-gradient(circle at 80% 20%, rgba(0,0,0,.06) 0 1px, transparent 1.5px)",
      timber: "repeating-linear-gradient(90deg, rgba(255,255,255,.1) 0 1px, transparent 1px 5px)",
      tile: "repeating-linear-gradient(0deg, rgba(255,255,255,.13) 0 1px, transparent 1px 5px), repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 1px, transparent 1px 8px)",
      window: "linear-gradient(rgba(104,134,150,.95), rgba(104,134,150,.95)) 7px 7px / 16px 16px no-repeat",
      lawn: "repeating-linear-gradient(80deg, rgba(255,255,255,.1) 0 1px, transparent 1px 4px)",
    };

    const STAGES = [
      {
        id: 1, name: "Site survey", sw: MAT.peg, tex: null, ink: "#fff",
        text: "The plot is cleared and the walls of all five wings are pegged out with string lines.",
        how: "Draped polygon and polyline graphics, plus Mesh pegs in a local vertex space.",
        cam: { heading: 20, tilt: 58, dist: 100 },
      },
      {
        id: 2, name: "Foundations", sw: MAT.concrete, tex: TEX.speckle, ink: "#2b2f36",
        text: "Strip footings go in a metre down under every wing, then blockwork and slabs bring the floors up to level.",
        how: "The ground turns translucent so below-grade meshes stay visible.",
        cam: { heading: 40, tilt: 50, dist: 66 }, groundOpacity: 0.3,
      },
      {
        id: 3, name: "Ground floor", sw: MAT.render, tex: TEX.roughcast, ink: "#2b2f36",
        text: "Roughcast-rendered walls rise around every opening: the double garage, the entrance and the garden room.",
        how: "Each wall is generated as solid segments around its openings.",
        cam: { heading: 18, tilt: 66, dist: 62 },
      },
      {
        id: 4, name: "Upper floor", sw: MAT.deck, tex: TEX.timber, ink: "#2b2014",
        text: "Floor decks go on, then the upper walls climb to the eaves around the tall stair window.",
        how: "Elements drop and rise into place by rebuilding their mesh every frame.",
        cam: { heading: -38, tilt: 64, dist: 64 },
      },
      {
        id: 5, name: "Roof", sw: MAT.tile, tex: TEX.tile, ink: "#fff",
        text: "Five tiled roofs and a front gable meet in valleys, finished with three rendered chimneys, gutters and downpipes.",
        how: "Roofs run into one another, so every valley comes from the geometry itself.",
        cam: { heading: 112, tilt: 62, dist: 66 },
      },
      {
        id: 6, name: "Windows and doors", sw: MAT.timber, tex: TEX.window, ink: "#fff",
        text: "Timber windows on stone sills, the glazed entrance and gable window, two garage doors and a pair of roof lights.",
        how: "Glazing uses a semi-transparent mesh material with blended alpha.",
        cam: { heading: 12, tilt: 74, dist: 38, tx: 0, ty: -9 },
      },
      {
        id: 7, name: "Landscape", sw: MAT.lawn, tex: TEX.lawn, ink: "#fff",
        text: "The tarmac drive, a curved front path, a gravel planter and lawns finish the plot.",
        how: "Drive, paving and lawn are draped on the terrain; low-poly trees grow from their base.",
        cam: { heading: 24, tilt: 60, dist: 88 },
      },
    ];

    /* ==================================================================
       3. Geometry helpers (plan metres → triangle meshes)
       ================================================================== */
    // Eight-vertex prism: 0-3 bottom ring (counter-clockwise from above), 4-7 top ring.
    const HEX_FACES = [0,3,2, 0,2,1, 4,5,6, 4,6,7, 0,1,5, 0,5,4, 2,3,7, 2,7,6, 3,0,4, 3,4,7, 1,2,6, 1,6,5];
    const hexa = (verts) => ({ verts, faces: HEX_FACES });
    function prism(bottom, top) {
      let a = 0;
      for (let i = 0; i < 4; i++) { const p = bottom[i], q = bottom[(i + 1) % 4]; a += p[0] * q[1] - q[0] * p[1]; }
      if (a < 0) { bottom = [bottom[0], bottom[3], bottom[2], bottom[1]]; top = [top[0], top[3], top[2], top[1]]; }
      return hexa([...bottom, ...top]);
    }
    function box(xa, ya, za, xb, yb, zb) {
      const [x0, x1] = [Math.min(xa, xb), Math.max(xa, xb)];
      const [y0, y1] = [Math.min(ya, yb), Math.max(ya, yb)];
      const [z0, z1] = [Math.min(za, zb), Math.max(za, zb)];
      return hexa([[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]);
    }
    const lift = (ring, dz) => ring.map(([x, y, z]) => [x, y, z + dz]);
    const slab = (ring, t = ROOF_T) => prism(ring, lift(ring, t));
    // Triangular gable: spans a0→a1 along `span` ("x" or "y"), p0→p1 thick, base zb, apex zt.
    function gable(span, a0, a1, p0, p1, zb, zt) {
      const am = (a0 + a1) / 2;
      const P = (a, p, z) => (span === "x" ? [a, p, z] : [p, a, z]);

    function buildModel() {

        if (b.storeys > 1) {
          decks.push(box(b.x0 + T, b.y0 + T, FLOOR1, b.x1 - T, b.y1 - T, FLOOR1 + DECK));
          E.push(meshElement(4, `${b.name}, upper walls`, [{ mat: "render", shapes: SIDES.flatMap((s) => wallBand(b, s, FLOOR1, b.eave)) }]));
        }
      }
      E.push(meshElement(4, "First-floor decks", [{ mat: "deck", shapes: decks }], { type: "drop", by: 3 }));

      // Stage 5: roofs
      const allGables = [], allGutters = [];
      const roofs = BLOCKS.map((b) => {
        const r = roofGeometry(b);
        allGables.push(...r.gables); allGutters.push(...r.gutters);
        E.push(meshElement(5, `${b.name} roof`, [{ mat: "tile", shapes: r.pitches }], { type: "drop", by: 4 }));
        return [b.id, r];
      });
      const roofOf = Object.fromEntries(roofs);
      E.push(meshElement(5, "Gable walls", [{ mat: "render", shapes: allGables }]));
      // The front gable that breaks the main eave over the entrance
      const fgA = 5.6 + 1.1; // 45° pitch
      E.push(meshElement(5, "Front gable", [
        { mat: "render", shapes: [gable("x", 3.2, 5.4, 0, T, 5.6, fgA)] },
        { mat: "tile", shapes: [
          slab([[2.6, -0.25, fgA - 1.7], [4.3, -0.25, fgA], [4.3, 2.4, fgA], [2.6, 2.4, fgA - 1.7]]),
          slab([[4.3, -0.25, fgA], [6.0, -0.25, fgA - 1.7], [6.0, 2.4, fgA - 1.7], [4.3, 2.4, fgA]]),
        ] },
      ], { type: "drop", by: 3 }));
      const stacks = [], caps = [], pots = [];
      for (const [x0, y0, x1, y1, zb, zt] of CHIMNEYS) {
        stacks.push(box(x0, y0, zb, x1, y1, zt));
        caps.push(box(x0 - 0.07, y0 - 0.07, zt, x1 + 0.07, y1 + 0.07, zt + 0.09));
        const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
        pots.push(box(cx - 0.12, cy - 0.12, zt + 0.09, cx + 0.12, cy + 0.12, zt + 0.55));
      }
      E.push(meshElement(5, "Chimneys", [{ mat: "chimney", shapes: [...stacks, ...caps] }, { mat: "pot", shapes: pots }]));
      const pipes = DOWNPIPES.map(([x, y, id]) => box(x - 0.045, y - 0.045, 0, x + 0.045, y + 0.045, roofOf[id].zl));
      E.push(meshElement(5, "Gutters and downpipes", [{ mat: "gutter", shapes: [...allGutters, ...pipes] }]));

      // Stage 6: windows and doors, one element per wall so each can slide in from outside
      for (const b of BLOCKS) {
        for (const side of SIDES) {
          const ops = (b.open || []).filter((o) => o.side === side);
          if (!ops.length) continue;
          const P = { timber: [], upvc: [], glass: [], black: [], garage: [], groove: [], sill: [] };
          ops.forEach((o) => openingShapes(b, o, P));
          if (b.id === "main" && side === "S") {
            // triangular gable window above the rectangular one
            P.timber.push(gable("x", 3.3, 5.3, -0.05, 0.0, 5.6, 6.6), box(3.93, -0.11, 3.6, 4.0, -0.07, 6.15), box(4.6, -0.11, 3.6, 4.67, -0.07, 6.15));
            P.glass.push(gable("x", 3.42, 5.18, -0.08, -0.05, 5.62, 6.47));
          }
          const out = side === "S" ? [0, -3] : side === "N" ? [0, 3] : side === "W" ? [-3, 0] : [3, 0];
          E.push(meshElement(6, `${b.name}, ${SIDE_NAME[side]} windows and doors`, Object.entries(P).map(([mat, shapes]) => ({ mat, shapes })), { type: "slide", dx: out[0], dy: out[1] }));
        }
        if (b.rooflights) {
          const tn = tan(b.pitch), zTop = (y) => b.eave + (y - b.y0) * tn + ROOF_T + 0.01;
          const frames = [], panes = [];
          for (const c of b.rooflights) {
            const ya = b.y0 + 0.9, yb = b.y0 + 1.9, xa = c - 0.38, xb = c + 0.38;
            const ring = [[xa, ya, zTop(ya)], [xb, ya, zTop(ya)], [xb, yb, zTop(yb)], [xa, yb, zTop(yb)]];
            frames.push(prism(ring, lift(ring, 0.12)));
            const inner = [[xa + 0.07, ya + 0.07, zTop(ya + 0.07) + 0.12], [xb - 0.07, ya + 0.07, zTop(ya + 0.07) + 0.12], [xb - 0.07, yb - 0.07, zTop(yb - 0.07) + 0.12], [xa + 0.07, yb - 0.07, zTop(yb - 0.07) + 0.12]];
            panes.push(prism(inner, lift(inner, 0.02)));
          }
          E.push(meshElement(6, `${b.name}, roof lights`, [{ mat: "rooflight", shapes: frames }, { mat: "glass", shapes: panes }], { type: "drop", by: 1.5 }));
        }
      }

      // Stage 7: landscape
      E.push(drapeElement(7, "Lawn", "polygon", rect(sx0 + 1, sy0 + 1, sx1 - 1, sy1 - 1), "lawn"));
      E.push(drapeElement(7, "Tarmac drive", "polygon", DRIVE, "tarmac"));
      PAVING.forEach(([name, ring]) => E.push(drapeElement(7, name, "polygon", ring, "paving")));
      E.push(drapeElement(7, "Planter", "polygon", BED, "gravel"));
      const bedWall = [];
      for (let i = 1; i < BED.length - 1; i++) bedWall.push(segWall(BED[i], BED[i + 1], 0.22, 0, 0.55));
      E.push(meshElement(7, "Planter wall", [{ mat: "bedWall", shapes: bedWall }]));
      E.push(meshElement(7, "Shrubs", [{ mat: "shrub", shapes: SHRUBS.map(([x, y, r]) => icosphere(x, y, 0.5 + r * 0.6, r, 0.75)) }], { type: "grow" }));
      TREES.forEach(([x, y, r], i) => {
        const h = 1.6 + r * 0.6;
        E.push(meshElement(7, `Tree ${i + 1}`, [
          { mat: "trunk", shapes: [box(x - 0.13, y - 0.13, 0, x + 0.13, y + 0.13, h + 0.5)] },
          { mat: i % 2 ? "leaf2" : "leaf", shapes: [icosphere(x, y, h + r * 0.95, r, 1.15)] },
        ], { type: "grow" }));
      });

      E.forEach((e, i) => (e.id = i));
      return E;
    }

    const MODEL = buildModel();
    const ALL_OPENINGS = BLOCKS.flatMap((b) => b.open || []);
    const ROOFLIGHT_COUNT = BLOCKS.reduce((a, b) => a + (b.rooflights?.length || 0), 0);
    const fmt = (n, d = 1) => n.toLocaleString("en-GB", { minimumFractionDigits: d, maximumFractionDigits: d });

    // Quantities shown for each stage, measured from the model itself
    const STAGE_FACTS = STAGES.map((st) => {
      const els = MODEL.filter((e) => e.stage === st.id);
      const vol = els.reduce((a, e) => a + e.vol, 0);
      const facts = [["Elements", String(els.length)]];
      if (vol > 0.5 && st.id !== 7) facts.push(["Volume", `${fmt(vol, 0)} m³`]);
      const footprint = BLOCKS.reduce((a, b) => a + (b.x1 - b.x0) * (b.y1 - b.y0), 0);
      const gia = BLOCKS.reduce((a, b) => a + (b.x1 - b.x0 - 2 * T) * (b.y1 - b.y0 - 2 * T) * b.storeys, 0);
      const glazed = ALL_OPENINGS.reduce((a, o) => a + (o.glazed || 0), 0) + ROOFLIGHT_COUNT * 0.62 * 0.86 + 0.5 * 1.76 * 0.85;
      const area = (names) => MODEL.filter((e) => names.includes(e.name)).reduce((a, e) => a + e.area, 0);
      const extra = {
        1: [["Footprint", `${fmt(footprint, 0)} m²`], ["Wings", String(BLOCKS.length)]],
        2: [["Footing depth", "1.0 m"]],
        3: [["Wall height", `${fmt(FLOOR1 - SLAB, 2)} m`], ["Openings", String(ALL_OPENINGS.filter((o) => o.z0 < FLOOR1).length)]],
        4: [["Floor area", `${fmt(gia, 0)} m²`]],
        5: [["Pitch", "40°"], ["Chimneys", String(CHIMNEYS.length)]],
        6: [["Openings", String(ALL_OPENINGS.length + ROOFLIGHT_COUNT)], ["Glazed area", `${fmt(glazed)} m²`]],
        7: [["Trees", String(TREES.length)], ["Drive", `${fmt(area(["Tarmac drive"]), 0)} m²`], ["Paving", `${fmt(area(PAVING.map((p) => p[0])), 0)} m²`]],
      }[st.id];
      return [...facts, ...extra].slice(0, 4);
    });

    /* ==================================================================
       5. Scene controller: everything that talks to the ArcGIS SDK
       ================================================================== */
    const SYM = {
      built: { type: "mesh-3d", symbolLayers: [{ type: "fill", edges: { type: "solid", color: [20, 26, 44, 0.18], size: 0.5 } }] },
      picked: { type: "mesh-3d", symbolLayers: [{ type: "fill", edges: { type: "solid", color: [61, 90, 254, 1], size: 2.4 } }] },
      ghost: { type: "mesh-3d", symbolLayers: [{ type: "fill", castShadows: false, material: { color: [61, 90, 254, 0.035], colorMixMode: "replace" }, edges: { type: "solid", color: [76, 104, 255, 0.9], size: 1 } }] },
      ghostFill: { type: "simple-fill", color: [61, 90, 254, 0.06], outline: { color: [76, 104, 255, 0.95], width: 1.2, style: "dash" } },
      ghostLine: { type: "simple-line", color: [76, 104, 255, 0.95], width: 1.2, style: "dash" },
    };
    const builtDrape = (e) => e.type === "polygon"
      ? { type: "simple-fill", color: MAT[e.mat], outline: { color: [0, 0, 0, 0], width: 0 } }
      : { type: "simple-line", color: MAT[e.mat], width: 2, style: "dash" };

    const easeOut = (p) => 1 - Math.pow(1 - p, 3);

    async function loadArcGIS() {
      const t0 = performance.now();
      while (!window.$arcgis) {
        if (performance.now() - t0 > 20000) throw new Error("The ArcGIS SDK did not load.");
        await new Promise((r) => setTimeout(r, 50));
      }
      const [GraphicsLayer, Graphic, Mesh, MeshLocalVertexSpace, Point, Polygon, Polyline, Camera] = await window.$arcgis.import([
        "@arcgis/core/layers/GraphicsLayer.js",
        "@arcgis/core/Graphic.js",
        "@arcgis/core/geometry/Mesh.js",
        "@arcgis/core/geometry/support/MeshLocalVertexSpace.js",
        "@arcgis/core/geometry/Point.js",
        "@arcgis/core/geometry/Polygon.js",
        "@arcgis/core/geometry/Polyline.js",
        "@arcgis/core/Camera.js",
      ]);
      await customElements.whenDefined("arcgis-scene");
      return { GraphicsLayer, Graphic, Mesh, MeshLocalVertexSpace, Point, Polygon, Polyline, Camera };
    }

    class HouseScene {
      constructor(el, sdk, place, { onPick, onPlace, onUserNavigate }) {
        Object.assign(this, { el, sdk, onPick, onPlace, onUserNavigate });
        this.items = [];
        this.stage = 0;
        this.ghost = true;
        this.placing = false;
        this.picked = null;
        this.raf = null;
        this.orbitRaf = null;
        this.listeners = [];
        this.base = 0;
        this.setPlaceValues(place);
      }

      setPlaceValues(place) {
        this.place = { ...place };
        this.mLon = M_LAT * Math.cos((place.latitude * Math.PI) / 180);
        const r = (place.rotation * Math.PI) / 180;
        this.cos = Math.cos(r); this.sin = Math.sin(r);
      }
      // plan metres (already offset) → rotated metres around the placement point
      rot(x, y) { return [x * this.cos + y * this.sin, -x * this.sin + y * this.cos]; }
      toLonLat(x, y) {
        const [rx, ry] = this.rot(x, y);
        return [this.place.longitude + rx / this.mLon, this.place.latitude + ry / M_LAT];
      }

      async queryBase() {
        const { Point } = this.sdk;
        try {
          const res = await Promise.race([
            this.el.map.ground.queryElevation(new Point({ longitude: this.place.longitude, latitude: this.place.latitude, spatialReference: { wkid: 4326 } })),
            new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 8000)),
          ]);
          return (res.geometry.z ?? 0) + 0.05;
        } catch (e) {
          console.warn("Elevation query failed, building at 0 m", e);
          return 0;
        }
      }

      async init() {
        const { GraphicsLayer, Graphic } = this.sdk;
        await this.el.viewOnReady();
        const map = this.el.map;
        this.base = await this.queryBase();

        this.drapeLayer = new GraphicsLayer({ title: "Site surfaces", elevationInfo: { mode: "on-the-ground" } });
        this.meshLayer = new GraphicsLayer({ title: "House model", elevationInfo: { mode: "absolute-height" } });
        map.addMany([this.drapeLayer, this.meshLayer]);

        for (const def of MODEL) {
          const graphic = new Graphic({ geometry: def.kind === "mesh" ? this.mesh(def, 1) : this.drape(def), attributes: { id: def.id, name: def.name, stage: def.stage } });
          this.items.push({ def, graphic, full: graphic.geometry, tween: null });
          (def.kind === "mesh" ? this.meshLayer : this.drapeLayer).add(graphic);
        }

        this.el.environment.lighting = { type: "sun", directShadowsEnabled: true, cameraTrackingEnabled: false, date: new Date() };
        this.el.environment.weather = { type: "sunny", cloudCover: 0.25 };

        const on = (type, fn) => { this.el.addEventListener(type, fn); this.listeners.push([type, fn]); };
        on("arcgisViewClick", (e) => this.handleClick(e));
        const userMoved = () => this.orbitRaf && this.onUserNavigate?.();
        on("arcgisViewDrag", userMoved);
        on("arcgisViewMouseWheel", userMoved);

        this.el.camera = this.camera(0, 0, 2600);
      }

      destroy() {
        cancelAnimationFrame(this.raf); cancelAnimationFrame(this.orbitRaf);
        this.listeners.forEach(([t, f]) => this.el.removeEventListener(t, f));
      }

      /* ----- placement ----- */
      async setPlacement(place) {
        const moved = place.longitude !== this.place.longitude || place.latitude !== this.place.latitude;
        this.setPlaceValues(place);
        if (moved) this.base = await this.queryBase();
        for (const it of this.items) {
          it.tween = null;
          it.full = it.def.kind === "mesh" ? this.mesh(it.def, 1) : this.drape(it.def);
          it.graphic.geometry = it.full;
        }
        this.applySymbols();
        return moved;
      }

      setPlacing(on) {
        this.placing = on;
        if (on) this.picked = null;
        this.applySymbols();
        this.updateOpacity();
      }

      updateOpacity() {
        const g = STAGES[this.stage - 1]?.groundOpacity ?? 1;
        this.el.map.ground.opacity = g;
        this.drapeLayer.opacity = this.placing ? 0.25 : g;
      }

      /* ----- geometry ----- */
      mesh(def, p, anim = def.anim) {
        const src = def.pos, pos = new Float64Array(src.length);
        const q = Math.max(p, 0.02);
        for (let i = 0; i < src.length; i += 3) {
          let x = src[i], y = src[i + 1], z = src[i + 2];
          if (p < 1) {
            if (anim.type === "rise") z = def.zMin + (z - def.zMin) * q;
            else if (anim.type === "drop") z += (1 - p) * anim.by;
            else if (anim.type === "slide") { x += (1 - p) * anim.dx; y += (1 - p) * anim.dy; }
            else if (anim.type === "grow") { x = def.cx + (x - def.cx) * q; y = def.cy + (y - def.cy) * q; z = def.zMin + (z - def.zMin) * q; }
          }
          const [rx, ry] = this.rot(x, y);
          pos[i] = rx; pos[i + 1] = ry; pos[i + 2] = z;
        }
        const { Mesh, MeshLocalVertexSpace } = this.sdk;
        return new Mesh({
          vertexAttributes: { position: pos },
          components: def.comps.map((c) => ({
            faces: c.faces,
            shading: "flat",
            material: { color: c.color, alphaMode: c.color[3] < 1 ? "blend" : "opaque", doubleSided: true },
          })),
          vertexSpace: new MeshLocalVertexSpace({ origin: [this.place.longitude, this.place.latitude, this.base] }),
          spatialReference: { wkid: 4326 },
        });
      }

      drape(def) {
        const { Polygon, Polyline } = this.sdk;
        const ring = def.coords.map(([x, y]) => this.toLonLat(x, y));
        return def.type === "polygon"
          ? new Polygon({ rings: [ring], spatialReference: { wkid: 4326 } })
          : new Polyline({ paths: [ring], spatialReference: { wkid: 4326 } });
      }

      camera(heading, tilt, dist, tx = 0, ty = 0) {
        const { Camera, Point } = this.sdk;
        const hd = heading + this.place.rotation;
        const h = (hd * Math.PI) / 180, t = (tilt * Math.PI) / 180;
        const horiz = dist * Math.sin(t), up = dist * Math.cos(t);
        const [rtx, rty] = this.rot(tx, ty);
        const dx = rtx - Math.sin(h) * horiz, dy = rty - Math.cos(h) * horiz;
        return new Camera({
          position: new Point({ longitude: this.place.longitude + dx / this.mLon, latitude: this.place.latitude + dy / M_LAT, z: this.base + TARGET_Z + up, spatialReference: { wkid: 4326 } }),
          heading: hd, tilt, fov: 52,
        });
      }

      /* ----- state ----- */
      setStage(n, { animate = true } = {}) {
        const prev = this.stage;
        this.stage = n;
        const now = performance.now();
        const growing = animate && n > prev && !prefersReducedMotion();
        const entering = this.items.filter((it) => it.def.stage === n && it.def.kind === "mesh");
        for (const it of this.items) {
          it.tween = null;
          if (it.def.kind === "mesh") it.graphic.geometry = it.full;
        }
        if (growing) {
          const spread = Math.min(160, 1100 / Math.max(entering.length, 1));
          entering.forEach((it, k) => {
            if (it.def.anim.type === "none") return;
            it.tween = { start: now + 120 + k * spread, dur: 850, started: false };
          });
          this.loop();
        }
        this.updateOpacity();
        this.applySymbols();
      }

      setGhost(on) { this.ghost = on; this.applySymbols(); }

      setHour(hour) {
        const hh = Math.floor(hour), mm = Math.round((hour - hh) * 60);
        // 21 June, Irish Summer Time (UTC+1)
        const date = new Date(Date.UTC(2026, 5, 21, hh - 1, mm));
        const light = this.el.environment.lighting;
        if (light?.type === "sun") light.date = date;
      }

      applySymbols() {
        for (const it of this.items) {
          const { def, graphic } = it;
          const waiting = it.tween && !it.tween.started;
          const built = def.stage <= this.stage && !waiting;
          const removed = def.until && this.stage > def.until;
          graphic.visible = !removed && (built || this.ghost);
          // while moving the house, show it as a wireframe so the imagery underneath stays visible
          if (def.kind === "mesh") graphic.symbol = built && !this.placing ? (this.picked === def.id ? SYM.picked : SYM.built) : SYM.ghost;
          else graphic.symbol = built ? builtDrape(def) : def.type === "polygon" ? SYM.ghostFill : SYM.ghostLine;
        }
      }

      loop() {
        if (this.raf) return;
        const tick = () => {
          const now = performance.now();
          let active = false, symbolsDirty = false;
          for (const it of this.items) {
            const tw = it.tween;
            if (!tw) continue;
            const p = (now - tw.start) / tw.dur;
            if (p < 0) { active = true; continue; }
            if (!tw.started) { tw.started = true; symbolsDirty = true; }
            if (p >= 1) { it.graphic.geometry = it.full; it.tween = null; continue; }
            it.graphic.geometry = this.mesh(it.def, easeOut(p));
            active = true;
          }
          if (symbolsDirty) this.applySymbols();
          this.raf = active ? requestAnimationFrame(tick) : null;
        };
        this.raf = requestAnimationFrame(tick);
      }

      /* ----- camera ----- */
      flyTo(n, { intro = false } = {}) {
        if (this.orbitRaf) return;
        const { heading, tilt, dist, tx = 0, ty = 0 } = STAGES[n - 1].cam;
        const reduce = prefersReducedMotion();
        this.el.goTo(this.camera(heading, tilt, dist, tx, ty), {
          duration: reduce ? 0 : intro ? 4200 : 1900,
          easing: intro ? "in-out-expo" : "in-out-cubic",
        }).catch(() => {});
      }

      setOrbit(on) {
        cancelAnimationFrame(this.orbitRaf);
        this.orbitRaf = null;
        if (!on) return;
        const cam = this.el.camera;
        const dx = (cam.position.longitude - this.place.longitude) * this.mLon;
        const dy = (cam.position.latitude - this.place.latitude) * M_LAT;
        const dz = cam.position.z - (this.base + TARGET_Z);
        const dist = Math.min(Math.max(Math.hypot(dx, dy, dz), 20), 200);
        const tilt = Math.min(Math.max(cam.tilt, 35), 82);
        let heading = cam.heading - this.place.rotation, last = performance.now();
        const step = (now) => {
          heading = (heading + (now - last) * 0.006) % 360; // ~6° a second
          last = now;
          this.el.camera = this.camera(heading, tilt, dist);
          this.orbitRaf = requestAnimationFrame(step);
        };
        this.orbitRaf = requestAnimationFrame(step);
      }

      /* ----- clicks: measure an element, or move the house ----- */
      async handleClick(e) {
        if (this.placing) {
          const mp = e.detail?.mapPoint;
          if (mp) this.onPlace?.({ longitude: mp.longitude, latitude: mp.latitude });
          return;
        }
        try {
          const res = await this.el.hitTest(e.detail, { include: [this.meshLayer, this.drapeLayer] });
          const hit = res.results.find((r) => r.graphic?.attributes?.name);
          const def = hit ? MODEL[hit.graphic.attributes.id] : null;
          this.picked = def?.kind === "mesh" ? def.id : null;
          this.applySymbols();
          this.onPick?.(def ? { name: def.name, stage: def.stage, vol: def.vol, area: def.area, built: def.stage <= this.stage } : null);
        } catch (err) { console.warn(err); }
      }
      clearPick() { this.picked = null; this.applySymbols(); }
    }

    /* ==================================================================
       6. React UI
       ================================================================== */
    const Icon = {
      play: html`<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.6-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z" fill="currentColor"/></svg>`,
      pause: html`<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>`,
      prev: html`<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>`,
      next: html`<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>`,
      check: html`<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg>`,
      dot: html`<svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="3" fill="currentColor"/></svg>`,
      code: html`<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>`,
      blueprint: html`<svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3Z M4 7.5l8 4.5 8-4.5 M12 12v9" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" strokeDasharray="3 2"/></svg>`,
      orbit: html`<svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="4.2" fill="none" stroke="currentColor" strokeWidth="1.7"/><path d="M12 5v9" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"/><path d="M19.5 9.6l1.6-.6-.2 1.8" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"/></svg>`,
      sun: html`<svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" strokeWidth="1.7"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"/></svg>`,
      pin: html`<svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11Z" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round"/><circle cx="12" cy="10" r="2.3" fill="none" stroke="currentColor" strokeWidth="1.7"/></svg>`,
      close: html`<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>`,
    };

    const swatchStyle = (s) => ({ "--sw": rgb(s.sw), "--sw-tex": s.tex || "none", "--sw-ink": s.ink });

    function StageList({ stage, onSelect }) {
      return html`
        <ol className="stages">
          ${STAGES.map((s, i) => {
            const state = s.id < stage ? "built" : s.id === stage ? "current" : "upcoming";
            return html`
              <li key=${s.id} className=${`stage ${state}`} style=${swatchStyle(s)}>
                <button onClick=${() => onSelect(s.id)} aria-current=${state === "current" ? "step" : undefined}>
                  <span className="swatch">${s.id}</span>
                  <span className="name">${s.name}</span>
                  <span className="state">${state === "built" ? Icon.check : state === "current" ? null : Icon.dot}</span>
                </button>
                ${state === "current" && html`
                  <div className="detail">
                    <p>${s.text}</p>
                    <dl className="facts">
                      ${STAGE_FACTS[i].map(([k, v]) => html`<div key=${k}><dt>${k}</dt><dd>${v}</dd></div>`)}
                    </dl>
                    <p className="how">${Icon.code}<span>${s.how}</span></p>
                  </div>`}
              </li>`;
          })}
        </ol>`;
    }

    function Dock({ stage, setStage, playing, setPlaying, ghost, setGhost, orbit, setOrbit, placing, setPlacing, hour, setHour }) {
      const s = STAGES[stage - 1];
      const hh = String(Math.floor(hour)).padStart(2, "0"), mm = String(Math.round((hour % 1) * 60)).padStart(2, "0");
      return html`
        <div className="dock glass" role="group" aria-label="Build playback">
          <div className="transport">
            <button className="icon-btn" onClick=${() => setStage(Math.max(1, stage - 1))} disabled=${stage === 1} aria-label="Previous stage">${Icon.prev}</button>
            <button className="play" onClick=${() => setPlaying(!playing)} aria-label=${playing ? "Pause build" : "Play build"}>${playing ? Icon.pause : Icon.play}</button>
            <button className="icon-btn" onClick=${() => setStage(Math.min(STAGES.length, stage + 1))} disabled=${stage === STAGES.length} aria-label="Next stage">${Icon.next}</button>
          </div>

          <div className="timeline">
            <div className="timeline-head">
              <strong>${s.name}</strong>
              <span>Stage ${stage} of ${STAGES.length}</span>
            </div>
            <div className="track">
              ${STAGES.map((st) => {
                const cls = st.id < stage ? "built" : st.id === stage ? "current" : "";
                return html`<button key=${st.id + (st.id === stage ? `-${playing}` : "")}
                  className=${`seg ${cls} ${playing && st.id === stage ? "playing" : ""}`}
                  style=${{ "--sw": rgb(st.sw), "--dwell": `${DWELL}ms` }}
                  onClick=${() => setStage(st.id)} aria-label=${`Go to stage ${st.id}, ${st.name}`}><i></i></button>`;
              })}
            </div>
          </div>

          <div className="controls">
            <button className="toggle" aria-pressed=${ghost} onClick=${() => setGhost(!ghost)} title="Show stages still to come as a blueprint">${Icon.blueprint}Blueprint</button>
            <button className="toggle" aria-pressed=${orbit} onClick=${() => setOrbit(!orbit)} title="Slowly circle the house">${Icon.orbit}Orbit</button>
            <button className="toggle" aria-pressed=${placing} onClick=${() => setPlacing(!placing)} title="Click the map to move the house, then turn it">${Icon.pin}Move house</button>
            <label className="sun" title="Time of day on 21 June">
              ${Icon.sun}
              <input type="range" min="5" max="21.5" step="0.25" value=${hour} onInput=${(e) => setHour(parseFloat(e.target.value))} aria-label="Time of day" />
              <span>${hh}:${mm}</span>
            </label>
          </div>
        </div>`;
    }

    function PlacePanel({ place, setRotation, onDone }) {
      return html`
        <div className="place glass" role="dialog" aria-label="Move the house">
          <h2>Move the house</h2>
          <p>Click the map where the house stands, then turn it until the walls line up with the roof in the imagery.</p>
          <label className="rot">
            <span>Turn</span>
            <input type="range" min="-180" max="180" step="1" value=${place.rotation} onInput=${(e) => setRotation(parseFloat(e.target.value))} aria-label="Rotation in degrees" />
            <output>${Math.round(place.rotation)}°</output>
          </label>
          <div className="place-foot">
            <span>${place.latitude.toFixed(5)}, ${place.longitude.toFixed(5)}</span>
            <button className="done" onClick=${onDone}>Done</button>
          </div>
        </div>`;
    }

    function App() {
      const sceneRef = useRef(null);
      const ctrl = useRef(null);
      const [status, setStatus] = useState("loading");
      const [stage, setStageRaw] = useState(1);
      const [playing, setPlaying] = useState(false);
      const [ghost, setGhost] = useState(true);
      const [orbit, setOrbit] = useState(false);
      const [placing, setPlacing] = useState(false);
      const [place, setPlace] = useState(readPlace);
      const [hour, setHour] = useState(16);
      const [picked, setPicked] = useState(null);
      const prevStage = useRef(1);
      const stageRef = useRef(1);
      stageRef.current = stage;

      // Boot the scene once
      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            const sdk = await loadArcGIS();
            const c = new HouseScene(sceneRef.current, sdk, place, {
              onPick: setPicked,
              onPlace: (p) => setPlace((cur) => ({ ...cur, ...p })),
              onUserNavigate: () => setOrbit(false),
            });
            await c.init();
            if (cancelled) return c.destroy();
            ctrl.current = c;
            c.setHour(16);
            c.setStage(1, { animate: false });
            setStatus("ready");
            c.flyTo(1, { intro: true });
          } catch (err) {
            console.error(err);
            if (!cancelled) setStatus("error");
          }
        })();
        return () => { cancelled = true; ctrl.current?.destroy(); };
      }, []);

      const choose = useCallback((n) => { setPlaying(false); setStageRaw(n); }, []);

      // Push stage changes into the scene
      useEffect(() => {
        const c = ctrl.current;
        if (!c || status !== "ready") return;
        if (prevStage.current !== stage || c.stage !== stage) {
          c.setStage(stage, { animate: stage > prevStage.current });
          c.flyTo(stage);
          prevStage.current = stage;
        }
      }, [stage, status]);

      useEffect(() => { ctrl.current?.setGhost(ghost); }, [ghost, status]);
      useEffect(() => { ctrl.current?.setHour(hour); }, [hour, status]);
      useEffect(() => { ctrl.current?.setPlacing(placing); if (placing) setPicked(null); }, [placing, status]);
      useEffect(() => {
        const c = ctrl.current;
        if (!c) return;
        c.setOrbit(orbit);
        if (!orbit && status === "ready") c.flyTo(stage);
      }, [orbit, status]);

      // Move or turn the house
      useEffect(() => {
        const c = ctrl.current;
        if (!c || status !== "ready") return;
        writePlace(place);
        c.setPlacement(place).then((moved) => { if (moved) c.flyTo(stageRef.current); });
      }, [place, status]);

      // Playback: hold each stage, then move on
      useEffect(() => {
        if (!playing) return;
        const id = setTimeout(() => {
          if (stage < STAGES.length) setStageRaw(stage + 1);
          else setPlaying(false);
        }, DWELL);
        return () => clearTimeout(id);
      }, [playing, stage]);

      const togglePlay = useCallback((on) => {
        if (on && stage === STAGES.length) { prevStage.current = 0; setStageRaw(1); }
        setPlaying(on);
      }, [stage]);

      // Keyboard: ← → move between stages, space plays or pauses
      useEffect(() => {
        const onKey = (e) => {
          if (e.target.closest?.("input, button, arcgis-scene")) return;
          if (e.key === "ArrowRight") choose(Math.min(STAGES.length, stage + 1));
          else if (e.key === "ArrowLeft") choose(Math.max(1, stage - 1));
          else if (e.key === " ") { e.preventDefault(); togglePlay(!playing); }
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [stage, playing, choose, togglePlay]);

      const pickedStage = picked && STAGES[picked.stage - 1];
      let corner = null;
      if (status === "ready" && placing) {
        corner = html`<${PlacePanel} place=${place} setRotation=${(r) => setPlace((cur) => ({ ...cur, rotation: r }))} onDone=${() => setPlacing(false)} />`;
      } else if (picked) {
        corner = html`<div className="pick glass" role="status">
            <h2>${picked.name}</h2>
            <p>${picked.built ? "Added" : "Planned"} in stage ${picked.stage}, ${pickedStage.name.toLowerCase()}</p>
            ${picked.vol > 0.01 ? html`<p>${fmt(picked.vol, 2)} m³ of material</p>` : picked.area > 0 ? html`<p>${fmt(picked.area, 0)} m²</p>` : null}
            <button className="icon-btn" onClick=${() => { setPicked(null); ctrl.current?.clearPick(); }} aria-label="Clear selection">${Icon.close}</button>
          </div>`;
      } else if (status === "ready") {
        corner = html`<div className="hint glass">Click any part of the house to measure it</div>`;
      }

      return html`
        <div className="app">
          <arcgis-scene ref=${sceneRef} basemap="satellite" ground="world-elevation" quality-profile="high"
            center=${`${place.longitude},${place.latitude}`} zoom="15"></arcgis-scene>

          <aside className="panel glass" aria-label="Build stages">
            <header>
              <h1>Modelling the house</h1>
              <p>Seven stages, from the first survey peg to a finished garden.</p>
            </header>
            <${StageList} stage=${stage} onSelect=${choose} />
          </aside>

          <${Dock} stage=${stage} setStage=${choose} playing=${playing} setPlaying=${togglePlay}
            ghost=${ghost} setGhost=${setGhost} orbit=${orbit} setOrbit=${setOrbit}
            placing=${placing} setPlacing=${setPlacing} hour=${hour} setHour=${setHour} />

          ${corner}

          <div className=${`veil ${status === "ready" ? "gone" : ""}`} aria-hidden=${status === "ready"}>
            <div className="veil-inner">
              ${status === "error"
                ? html`<div key="error"><h1>Scene unavailable</h1><p>The 3D scene couldn't load. Check your connection to js.arcgis.com, then reload the page.</p></div>`
                : html`<div key="loading"><h1>Modelling the house</h1><p>Preparing the plot</p><div className="bar"></div></div>`}
            </div>
          </div>
        </div>`;
    }

    createRoot(document.getElementById("root")).render(html`<${App} />`);
  </script>
</body>
</html>
